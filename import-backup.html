<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Importar backup</title>
<style>body{font:16px system-ui;max-width:620px;margin:60px auto;padding:24px}button,input{font:inherit;margin:10px 0;padding:12px}#status{white-space:pre-wrap}</style>
<h1>Importar backup no Firebase</h1><p id="account">Verificando login…</p><button id="login" hidden>Entrar com Google</button><input id="file" type="file" accept="application/json" hidden><button id="send" hidden>Enviar e verificar backup</button><p id="status"></p>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:'AIzaSyBY35RmjCQcfGc0Kj3LZll5J2jHaHooW24',authDomain:'vinicinho-doces-vf70.firebaseapp.com',projectId:'vinicinho-doces-vf70',storageBucket:'vinicinho-doces-vf70.firebasestorage.app',messagingSenderId:'697137577803',appId:'1:697137577803:web:f748d80d4b699a6e98f2ce'});
const auth=firebase.auth(),db=firebase.firestore(),allowed='viniciusferpa70@gmail.com',keys=['vendas','produtos','despesas','clientes','fornecedores','preVendas','servicos','producoes','caixa'];
const account=document.querySelector('#account'),login=document.querySelector('#login'),file=document.querySelector('#file'),send=document.querySelector('#send'),status=document.querySelector('#status');
login.onclick=()=>auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider().setCustomParameters({login_hint:allowed}));
auth.onAuthStateChanged(async user=>{if(!user){account.textContent='Entre com a conta autorizada.';login.hidden=false;return}if(user.email!==allowed){await auth.signOut();status.textContent='Conta não autorizada.';return}account.textContent='Conectado: '+user.email;file.hidden=false;send.hidden=false});
send.onclick=async()=>{try{if(!file.files[0])throw Error('Selecione o arquivo.');status.textContent='Enviando…';const parsed=JSON.parse(await file.files[0].text()),data=parsed.data||parsed;for(const key of keys.slice(0,5))if(!Array.isArray(data[key]))throw Error('Backup inválido: '+key);const count=keys.reduce((n,k)=>n+(Array.isArray(data[k])?data[k].length:0),0);await db.collection('businesses').doc('vinicinho-doces').set({payload:{...data,ultimoBackupImportado:new Date().toISOString()},updatedAt:firebase.firestore.FieldValue.serverTimestamp(),owner:allowed});const check=await db.collection('businesses').doc('vinicinho-doces').get({source:'server'}),saved=check.data().payload,savedCount=keys.reduce((n,k)=>n+(Array.isArray(saved[k])?saved[k].length:0),0);if(savedCount!==count)throw Error(`Esperado ${count}, salvo ${savedCount}.`);status.textContent=`SUCESSO: ${savedCount} registros confirmados. Clientes: ${saved.clientes.length} | Vendas: ${saved.vendas.length} | Produtos: ${saved.produtos.length}`}catch(error){status.textContent='ERRO: '+(error.message||error)}};
</script></html>
